<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Flight Recorder</title>
<link rel="stylesheet" href="/static/style.css"/>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <h1>Flight Recorder</h1>
      <div class="host">host: <strong id="hostname">&hellip;</strong> &middot; command audit &amp; daily activity</div>
    </div>
  </header>

  <section class="card">
    <div class="cal-head">
      <div>
        <h2>Activity</h2>
        <p class="sub">Last 12 months of recorded activity</p>
      </div>
      <div class="toggle" role="tablist" aria-label="Heatmap metric">
        <button id="btn-tasks" class="active">Tasks</button>
        <button id="btn-ops">Operations</button>
      </div>
    </div>
    <div class="cal-body">
      <div class="cal-main">
        <div class="months" id="months"></div>
        <div class="cal-grid">
          <div class="wdays"><span></span><span>Mon</span><span></span><span>Wed</span><span></span><span>Fri</span><span></span></div>
          <div class="weeks" id="weeks"></div>
        </div>
        <div class="legend">Less
          <span class="sw" style="background:var(--c0)"></span>
          <span class="sw" style="background:var(--c1)"></span>
          <span class="sw" style="background:var(--c2)"></span>
          <span class="sw" style="background:var(--c3)"></span>
          <span class="sw" style="background:var(--c4)"></span>
          More</div>
        <div class="hint">Click a day to open its report &mdash; click the day again or the &times; to close.</div>
      </div>
      <div class="years" id="years"></div>
    </div>
  </section>

  <section class="card" id="report" hidden>
    <div class="report-head">
      <h2 id="report-title">Day report</h2>
      <button class="close-btn" id="report-close" aria-label="Close report">&times;</button>
    </div>
    <p class="meta" id="report-meta"></p>
    <div id="report-body"></div>
  </section>

  <section class="card">
    <h2>Recent activity</h2>
    <p class="sub">Most recent high-level operations, newest first</p>
    <ul id="recent"><li class="loading">Loading&hellip;</li></ul>
  </section>

</div>
<div class="tip" id="tip" hidden></div>
<script src="/static/app.js"></script>
</body>
</html>
